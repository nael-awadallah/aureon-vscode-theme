name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Generated themes are committed
        run: git diff --exit-code -- themes package.json
      - run: npm run check
      - run: npm test
      - name: Semantic tokens and UI audit in a clean VS Code
        run: xvfb-run -a npm run test:vscode
      - run: npm run package
